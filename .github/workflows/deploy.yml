name: Deploy Web Page to Nginx Container

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            rm -rf ~/mon-site-nginx
            git clone https://github.com/EDBOY7054/mon-site-nginx.git ~/mon-site-nginx
            cd ~/mon-site-nginx
            docker build -t mon-site-nginx .
            docker rm -f mon-site || true
            docker run -d --name mon-site -p 80:80 mon-site-nginx