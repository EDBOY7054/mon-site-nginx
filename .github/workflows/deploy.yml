name: Deploy Web Page to Nginx Container

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t mon-site-nginx .

      - name: Supprimer l'ancien conteneur
        continue-on-error: true
        run: docker rm -f mon-site

      - name: Lancer le conteneur
        run: docker run -d --name mon-site -p 8080:80 mon-site-nginx